<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel-2 Explorer｜航測及遙測分署 (本地測試)</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;font-family:"Microsoft JhengHei","Noto Sans TC","Avenir Next",sans-serif}
    #header{background:#0f1e28;color:#ffffff;height:60px;display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:2px solid #1e3a4e;flex-shrink:0}
    #logo{height:42px;flex-shrink:0}
    #spacer{flex-grow:1}
    #nav{display:flex;gap:4px;flex-shrink:0}
    #nav a{padding:6px 14px;color:#ffffff;text-decoration:none;font-size:13px;border-radius:3px;transition:background .15s;white-space:nowrap}
    #nav a:hover{background:rgba(255,255,255,0.12)}
    #nav a.active{background:rgba(255,255,255,0.2);font-weight:bold}
    @media(max-width:700px){#nav a{padding:6px 8px;font-size:12px}}
    iframe{width:100vw;height:calc(100vh - 60px);border:none;display:block}
  </style>
</head>
<body>
  <div id="header">
    <img id="logo" src="public/logo.png" alt="農業部林業及自然保育署 航測及遙測分署">
    <div id="spacer"></div>
    <nav id="nav">
      <a href="https://localhost:8080/">DMC III 航攝影像</a>
      <a href="https://localhost:8081/">福衛八號影像</a>
      <a href="#" class="active">Sentinel-2</a>
    </nav>
  </div>
  <iframe id="s2" allow="geolocation *" title="Sentinel-2 Explorer"></iframe>
  <script>
    var base = 'https://livingatlas.arcgis.com/sentinel2explorer/';
    var hash = window.location.hash || '#mapCenter=121.35975%2C23.69403%2C13.272';
    document.getElementById('s2').src = base + hash;
  </script>
</body>
</html>
