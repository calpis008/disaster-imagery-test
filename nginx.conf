# ============================================================================
# ASRS 緊急災害影像探索器 — nginx 設定（SPA 靜態站台）
#
# 注意：本專案 webpack 產物「無」/assets/ 子目錄，所有雜湊檔名的 js/css/字型
# 與 index.html、public/（縮圖、i18n locale json）皆平鋪在 html root 下
# （見 dist/disasterimageryexplorer/ 實際結構），故快取規則以副檔名比對，
# 而非比對路徑前綴。
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 壓縮
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;
    gzip_vary on;

    # 基本安全 headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # webpack 主要產物檔名含 content hash（例：main.4ad8ec3a881213eb4441.js、
    # main.4ad8ec3a881213eb4441.css、43821.2679fc6b3ef53853da47.js），
    # 內容變更即檔名變更，可安全長效 cache + immutable。
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 字型檔（含 hash，同樣可長效 cache）
    location ~* \.(woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # favicon 與 public/ 下的圖片（無 hash，用中等長度 cache 避免版本卡住）
    location ~* \.(png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # public/locales 下的 i18n json（無 hash），短快取
    location /public/locales/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA history fallback：非實體檔案的路徑一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不快取，確保部署新版後立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ------------------------------------------------------------------------
    # 【預留】未來對接 ASRS 內部 API 的反向代理範本（目前註解停用）。
    # 啟用時將 __ASRS_API_UPSTREAM__ 換成實際內部服務位址（建議以環境變數
    # 搭配 envsubst 或 confd 產生設定，不要寫死于版控）。
    # ------------------------------------------------------------------------
    # location /api/ {
    #     proxy_pass __ASRS_API_UPSTREAM__;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
