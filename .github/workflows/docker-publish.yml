# ============================================================================
# ASRS 緊急災害影像探索器 — Docker image 建置與發佈
#
# 觸發：push 到 main
# Secrets（Repo Settings → Secrets and variables → Actions → Secrets）：
#   DOCKERHUB_USERNAME：Docker Hub 帳號
#   DOCKERHUB_TOKEN   ：Docker Hub Access Token（勿用密碼）
# Variables（同頁 → Variables；ENV_* 為 webpack 建置期讀取的環境變數，
#   實際 .env 鍵名不含 ENV_ 前綴，經 build-arg 注入後由 webpack DefinePlugin
#   包成 ENV_* 全域常數，詳見 webpack/getGlobalConstants.js）：
#   DISASTER_IMAGERY_EXPLORER_APP_ID / DISASTER_RESPONSE_SERVICE_URL /
#   ARCGIS_PORTAL_ROOT_URL / IMAGERY_EXPLORER_WEB_MAP_ID
#   （未設定時為空字串，DISASTER_IMAGERY_EXPLORER_APP_ID 允許留空）
# ============================================================================
name: Docker Publish

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 打兩個 tag：latest 與 git commit SHA（追蹤部署版本用）
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/asrs-disaster-explorer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/asrs-disaster-explorer:${{ github.sha }}
          # 建置期變數：從 GitHub Variables（vars.*）讀取，經 build-arg 傳入
          build-args: |
            DISASTER_IMAGERY_EXPLORER_APP_ID=${{ vars.DISASTER_IMAGERY_EXPLORER_APP_ID }}
            DISASTER_RESPONSE_SERVICE_URL=${{ vars.DISASTER_RESPONSE_SERVICE_URL }}
            ARCGIS_PORTAL_ROOT_URL=${{ vars.ARCGIS_PORTAL_ROOT_URL }}
            IMAGERY_EXPLORER_WEB_MAP_ID=${{ vars.IMAGERY_EXPLORER_WEB_MAP_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
