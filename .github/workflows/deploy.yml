name: Deploy Imagery Explorers to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ── DMC III + FS8 builds (enterprise portal auth) ──────────────────
      - name: Create .env for DMC and FS8
        run: |
          {
            echo "DMC_EXPLORER_APP_ID = ${{ secrets.DMC_EXPLORER_APP_ID }}"
            echo "DMC_SERVICE_URL = ${{ secrets.DMC_SERVICE_URL }}"
            echo "FS8_EXPLORER_APP_ID = ${{ secrets.FS8_EXPLORER_APP_ID }}"
            echo "FS8_SERVICE_URL = ${{ secrets.FS8_SERVICE_URL }}"
            echo "ARCGIS_PORTAL_ROOT_URL = ${{ secrets.ARCGIS_PORTAL_ROOT_URL }}"
            echo "SENTINEL2_ORIGINAL_SERVICE_URL = https://sentinel.imagery1.arcgis.com/arcgis/rest/services/Sentinel2L2A/ImageServer"
            echo "SENTINEL2_EXPLORER_APP_ID = "
            echo "SENTINEL2_PROXY_SERVICE_URL = "
          } > .env

      - name: Build DMC Explorer
        run: npm run build:dmc

      - name: Build FS8 Explorer
        run: npm run build:fs8

      # ── Assemble and deploy ─────────────────────────────────────────────
      - name: Create root redirect page
        run: |
          cat > dist/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./dmcexplorer/">
            <title>航太影像探索</title>
          </head>
          <body>
            正在跳轉至 <a href="./dmcexplorer/">DMC III 航攝影像探索</a>…
          </body>
          </html>
          HTMLEOF

      - name: Create Sentinel-2 iframe wrapper page
        run: |
          mkdir -p dist/sentinel2explorer
          cat > dist/sentinel2explorer/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Sentinel-2 Explorer</title>
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              html,body{width:100%;height:100%;overflow:hidden;font-family:"Avenir Next",Helvetica,Arial,sans-serif}
              #nav{position:fixed;top:0;left:0;z-index:9999;display:flex;align-items:center;background:#1a2b36;color:#afdce9;height:40px;min-width:180px}
              #nav-info{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(175,220,233,0.3);cursor:default;font-size:18px}
              #nav-toggle{padding:0 10px;height:40px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;white-space:nowrap}
              #nav-toggle:hover{background:rgba(175,220,233,0.1)}
              #chevron{font-size:10px;transition:transform .2s}
              #nav-toggle.open #chevron{transform:rotate(180deg)}
              #nav-menu{display:none;position:absolute;top:40px;left:0;background:#1a2b36;border-top:1px solid rgba(175,220,233,0.3);min-width:200px}
              #nav-menu.open{display:block}
              #nav-menu a{display:block;padding:10px 16px;color:#afdce9;text-decoration:none;font-size:14px}
              #nav-menu a:hover{background:rgba(175,220,233,0.12)}
              iframe{width:100vw;height:100vh;border:none;display:block}
            </style>
          </head>
          <body>
            <div id="nav">
              <div id="nav-info">ℹ</div>
              <div id="nav-toggle" onclick="toggleMenu()">
                <span>Sentinel-2</span>
                <span id="chevron">▼</span>
              </div>
              <div id="nav-menu">
                <a href="../dmcexplorer/">DMC III 航攝影像</a>
                <a href="../fs8explorer/">福衛八號影像</a>
              </div>
            </div>
            <iframe id="s2" allow="geolocation *" title="Sentinel-2 Explorer"></iframe>
            <script>
              function toggleMenu(){
                var t=document.getElementById('nav-toggle');
                var m=document.getElementById('nav-menu');
                t.classList.toggle('open');
                m.classList.toggle('open');
              }
              document.addEventListener('click',function(e){
                if(!document.getElementById('nav').contains(e.target)){
                  document.getElementById('nav-toggle').classList.remove('open');
                  document.getElementById('nav-menu').classList.remove('open');
                }
              });
              var base='https://livingatlas.arcgis.com/sentinel2explorer/';
              var hash=window.location.hash||'#mapCenter=121.35975%2C23.69403%2C13.272';
              document.getElementById('s2').src=base+hash;
            </script>
          </body>
          </html>
          HTMLEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
