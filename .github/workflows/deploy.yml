name: Deploy Imagery Explorers to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ── DMC III + FS8 builds (enterprise portal auth) ──────────────────
      - name: Create .env for DMC and FS8
        run: |
          {
            echo "DMC_EXPLORER_APP_ID = ${{ secrets.DMC_EXPLORER_APP_ID }}"
            echo "DMC_SERVICE_URL = ${{ secrets.DMC_SERVICE_URL }}"
            echo "FS8_EXPLORER_APP_ID = ${{ secrets.FS8_EXPLORER_APP_ID }}"
            echo "FS8_SERVICE_URL = ${{ secrets.FS8_SERVICE_URL }}"
            echo "ARCGIS_PORTAL_ROOT_URL = ${{ secrets.ARCGIS_PORTAL_ROOT_URL }}"
            echo "SENTINEL2_ORIGINAL_SERVICE_URL = https://sentinel.imagery1.arcgis.com/arcgis/rest/services/Sentinel2L2A/ImageServer"
            echo "SENTINEL2_EXPLORER_APP_ID = "
            echo "SENTINEL2_PROXY_SERVICE_URL = "
          } > .env

      - name: Build DMC Explorer
        run: npm run build:dmc

      - name: Build FS8 Explorer
        run: npm run build:fs8

      # ── Sentinel-2 build (ArcGIS Online auth, no enterprise portal) ────
      - name: Create .env for Sentinel-2
        run: |
          {
            echo "SENTINEL2_EXPLORER_APP_ID = aSCMksIWuDEeRfu7"
            echo "SENTINEL2_PROXY_SERVICE_URL = "
            echo "SENTINEL2_ORIGINAL_SERVICE_URL = https://sentinel.imagery1.arcgis.com/arcgis/rest/services/Sentinel2L2A/ImageServer"
            echo "DMC_EXPLORER_APP_ID = "
            echo "DMC_SERVICE_URL = "
            echo "FS8_EXPLORER_APP_ID = "
            echo "FS8_SERVICE_URL = "
          } > .env

      - name: Build Sentinel-2 Explorer
        run: npm run build:sentinel2

      # ── Assemble and deploy ─────────────────────────────────────────────
      - name: Create root redirect page
        run: |
          cat > dist/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./dmcexplorer/">
            <title>航太影像探索</title>
          </head>
          <body>
            正在跳轉至 <a href="./dmcexplorer/">DMC III 航攝影像探索</a>…
          </body>
          </html>
          HTMLEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
