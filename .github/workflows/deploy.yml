name: Deploy Imagery Explorers to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ── DMC III + FS8 builds (enterprise portal auth) ──────────────────
      - name: Create .env for DMC and FS8
        run: |
          {
            echo "DMC_EXPLORER_APP_ID = ${{ secrets.DMC_EXPLORER_APP_ID }}"
            echo "DMC_SERVICE_URL = ${{ secrets.DMC_SERVICE_URL }}"
            echo "FS8_EXPLORER_APP_ID = ${{ secrets.FS8_EXPLORER_APP_ID }}"
            echo "FS8_SERVICE_URL = ${{ secrets.FS8_SERVICE_URL }}"
            echo "ARCGIS_PORTAL_ROOT_URL = ${{ secrets.ARCGIS_PORTAL_ROOT_URL }}"
            echo "SENTINEL2_ORIGINAL_SERVICE_URL = https://sentinel.imagery1.arcgis.com/arcgis/rest/services/Sentinel2L2A/ImageServer"
            echo "SENTINEL2_EXPLORER_APP_ID = "
            echo "SENTINEL2_PROXY_SERVICE_URL = "
          } > .env

      - name: Build DMC Explorer
        run: npm run build:dmc

      - name: Build FS8 Explorer
        run: npm run build:fs8

      # ── Assemble and deploy ─────────────────────────────────────────────
      - name: Create root redirect page
        run: |
          cat > dist/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./dmcexplorer/">
            <title>航太影像探索</title>
          </head>
          <body>
            正在跳轉至 <a href="./dmcexplorer/">DMC III 航攝影像探索</a>…
          </body>
          </html>
          HTMLEOF

      - name: Create Sentinel-2 iframe wrapper page
        run: |
          mkdir -p dist/sentinel2explorer
          cat > dist/sentinel2explorer/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Sentinel-2 Explorer｜航測及遙測分署</title>
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              html,body{width:100%;height:100%;overflow:hidden;font-family:"Microsoft JhengHei","Noto Sans TC","Avenir Next",sans-serif}
              #header{background:#0f1e28;color:#afdce9;height:60px;display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:2px solid #1e3a4e;flex-shrink:0}
              #logo{width:46px;height:46px;border-radius:50%;border:2px solid #afdce9;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
              #logo img{width:100%;height:100%;object-fit:cover}
              #logo-text{font-size:11px;font-weight:bold;text-align:center;line-height:1.3;color:#afdce9}
              #agency{flex-grow:1;min-width:0}
              #agency-main{font-size:16px;font-weight:bold;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
              #agency-sub{font-size:10px;color:rgba(175,220,233,0.55);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
              #nav{display:flex;gap:2px;flex-shrink:0}
              #nav a{padding:7px 14px;color:#afdce9;text-decoration:none;font-size:13px;border-radius:3px;transition:background .15s;white-space:nowrap}
              #nav a:hover{background:rgba(175,220,233,0.12)}
              #nav a.active{background:rgba(175,220,233,0.22);font-weight:bold}
              @media(max-width:700px){#agency-sub,#agency-main{font-size:12px}#nav a{padding:6px 8px;font-size:12px}}
              iframe{width:100vw;height:calc(100vh - 60px);border:none;display:block}
            </style>
          </head>
          <body>
            <div id="header">
              <div id="logo">
                <div id="logo-text">航測<br>遙測</div>
              </div>
              <div id="agency">
                <div id="agency-main">農業部林業及自然保育署 航測及遙測分署</div>
                <div id="agency-sub">Aerial Survey and Remote Sensing Branch, Forestry and Nature Conservation Agency, MOA</div>
              </div>
              <nav id="nav">
                <a href="../dmcexplorer/">DMC III 航攝影像</a>
                <a href="../fs8explorer/">福衛八號影像</a>
                <a href="#" class="active">Sentinel-2</a>
              </nav>
            </div>
            <iframe id="s2" allow="geolocation *" title="Sentinel-2 Explorer"></iframe>
            <script>
              var base='https://livingatlas.arcgis.com/sentinel2explorer/';
              var hash=window.location.hash||'#mapCenter=121.35975%2C23.69403%2C13.272';
              document.getElementById('s2').src=base+hash;
            </script>
          </body>
          </html>
          HTMLEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
